# Local development only. Activated by the spring-boot-maven-plugin
# configuration in api/pom.xml, so `mvn spring-boot:run` gets these and a
# packaged `java -jar` never does.
#
# Everything here is a debugging convenience that must not follow the app to a
# server. Logging every statement is the clearest example: an application row
# carries salary figures and free-text notes about a job hunt, and once
# hibernate.orm.jdbc.bind is on below, those values are written to stdout in
# full. That is fine on your own machine and a data leak anywhere else.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    # Uncomment to see the values bound into each query. Note what that means
    # before you do it on anything but your own data.
    # org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO
