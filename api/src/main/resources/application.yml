spring:
  application:
    name: jobtracker-api

  config:
    # Loads the gitignored .env as a property source, so ${GOOGLE_CLIENT_SECRET}
    # below resolves against it.
    #
    # Spring Boot has no special support for .env files - but a .env IS a
    # properties file, KEY=VALUE one per line, so [.properties] tells Boot to
    # parse it as one. That is why this needs no extra dependency.
    #
    # Two paths because the working directory depends on how the app was
    # started: api/ for `mvn -f api/pom.xml spring-boot:run` and for most IDE
    # run configurations, the repository root for anything launched from there.
    # `optional:` means a missing file is not an error, which is what keeps a
    # fresh clone and CI - neither of which has a .env - starting normally.
    #
    # Consequence worth knowing: values are read as Java properties, so a
    # backslash escapes and an unquoted # starts a comment. Google secrets
    # contain neither.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:jobtracker}
    # NOT the owner. From phase 5e the application connects as a role that owns
    # nothing and is therefore subject to the row-level security policies in
    # V8 - superusers and table owners bypass every policy unconditionally, so
    # connecting as DB_USER here would leave 5e enforcing precisely nothing.
    #
    # V8 creates this role. Flyway, below, still connects as the owner.
    username: ${DB_APP_USER:jobtracker_app}
    password: ${DB_APP_PASSWORD:jobtracker_app}
    hikari:
      # The pool must not demand a working connection at startup, because on a
      # database that has never been migrated the role it authenticates as does
      # not exist yet: V8 is what creates it. -1 makes the pool start empty and
      # connect on first use, which is after Flyway has run.
      initialization-fail-timeout: -1

  security:
    oauth2:
      client:
        registration:
          google:
            # No default on purpose. An app that starts without these looks
            # healthy right up until the first sign-in attempt fails somewhere
            # deep in a redirect; refusing to start names the missing variable.
            # See docs/google-oauth-setup.md.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # The three non-sensitive scopes, and nothing more. Anything
            # sensitive or restricted - Gmail, in phase 7 - drags the whole app
            # into Google verification.
            scope: openid, email, profile
        # No provider block: Google is one of the handful Spring Boot knows
        # about already, including its issuer, endpoints and the fact that the
        # user-name attribute is `sub`.

  mvc:
    problemdetails:
      # Makes Spring's OWN exceptions answer in RFC 9457 too.
      #
      # GlobalExceptionHandler only sees exceptions this code throws. Everything
      # Spring rejects before a controller method runs - an unparseable status
      # in the query string, malformed JSON, the wrong content type - was
      # answered with Boot's default {timestamp, status, error, path} body
      # instead. That body has no `detail` field, so the React ErrorNotice had
      # nothing to show but "Request failed with status 400", and the promise
      # that every error from this API has one shape was quietly untrue.
      #
      # See the @Order on GlobalExceptionHandler for what this setting requires
      # in return.
      enabled: true

  jpa:
    hibernate:
      # validate, never update. Flyway owns the schema; Hibernate only checks
      # that the entities match what the migrations produced.
      ddl-auto: validate
    # false = no lazy loading outside a transaction. Forces you to fetch what
    # you need in the service layer, which is how you avoid surprise N+1s.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run as the owner, deliberately. DDL needs it, and so does any
    # future backfill: V8's policies do not apply to the owner, so a migration
    # can still see every row in every workspace. This is the same split the
    # header of V8 describes - owner migrates, app role serves requests.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:jobtracker}
    user: ${DB_USER:jobtracker}
    password: ${DB_PASSWORD:jobtracker}
    placeholders:
      # Substituted into V8's CREATE ROLE. Kept out of the migration file so the
      # repository never holds a credential; see the note in V8 about what this
      # does and does not protect.
      appDbPassword: ${DB_APP_PASSWORD:jobtracker_app}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        # The session id is a bearer credential for the whole account, so
        # JavaScript has no business reading it - HttpOnly is what stops one
        # XSS bug from becoming a stolen session.
        http-only: true
        # Lax, not None: the cookie rides along with ordinary navigation but not
        # with cross-site POSTs, which removes most of CSRF before the token even
        # gets involved. localhost:5173 and localhost:8080 are the same site
        # despite the different ports, so the UI is unaffected.
        same-site: lax
        # Off in development because there is no TLS on localhost, and a Secure
        # cookie over http is simply never sent. Phase 8 sets this true.
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  docs:
    # OpenAPI and Swagger UI without signing in.
    #
    # Default false. The document does not contain data, but it is a precise map
    # of every endpoint and field, and there is no reason to hand that to an
    # unauthenticated caller in production. application-dev.yml turns it on,
    # which is what keeps `npm run generate:api` a one-command operation locally.
    public: ${DOCS_PUBLIC:false}

  tenancy:
    # The workspace V7 created for the backfill, and the one the first person to
    # sign in adopts.
    #
    # No longer a placeholder: 5b used this to name a tenant because there was
    # no principal to ask, and 5c deleted that class. What remains is a genuine
    # piece of bootstrap. The rows that existed before there were users live in
    # this workspace, so if nobody claimed it your own applications would sit in
    # a workspace you are not a member of. Everyone after the first gets a fresh
    # workspace of their own.
    #
    # See SignInService.claimAWorkspace.
    bootstrap-workspace-id: ${BOOTSTRAP_WORKSPACE_ID:1}

  auth:
    # Where the browser lands after Google sends it back.
    #
    # The UI, not the API. In development these are different origins, so the
    # framework default - resume whatever was being fetched when the session
    # expired - would leave the browser looking at raw JSON.
    success-redirect: ${AUTH_SUCCESS_REDIRECT:http://localhost:5173}

  automation:
    # Shared secret for the Python worker, which has no browser and so no
    # session. Blank means service authentication is off and the worker gets
    # 401s: an unset property must never read as "authentication optional".
    #
    # Generate a long random value and put it in .env. It is a credential that
    # acts across every workspace, which makes it the one secret in this project
    # that must never reach a browser. Phase 5f replaces it with per-job
    # identities and rotation.
    service-key: ${AUTOMATION_SERVICE_KEY:}

  # Origins allowed to call this API from a browser. The Vite dev server runs on 5173.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.flywaydb: INFO
